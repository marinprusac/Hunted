[config]
schemaVersion = "0.0.1"

[package]
namespace = "Prussian"
name = "Hunted"
# Kept in sync with Hunted.csproj by publish.sh.
versionNumber = "0.1.2"
description = "Early development, Dead by Daylight inspired. One invulnerable killer with a sword hunts the survivors while they extract valuables and escape. The host picks the killer in the lobby. Everyone needs the mod."
websiteUrl = "https://github.com/marinprusac/Hunted"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
REPOModding-MenuLib = "2.6.1"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./dist"

[[build.copy]]
source = "./bin/Release/netstandard2.1/Hunted.dll"
target = "./"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./"

[publish]
repository = "https://thunderstore.io"
communities = ["repo"]

[publish.categories]
repo = []
