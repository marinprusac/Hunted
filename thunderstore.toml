[config]
schemaVersion = "0.0.1"

[package]
namespace = "Prussian"
name = "Hunted"
# Kept in sync with Hunted.csproj by publish.sh.
versionNumber = "0.3.1"
description = "Dead by Daylight inspired. The host plays one of two killers and hunts the survivors while they extract valuables and escape. Everyone needs the mod."
websiteUrl = "https://github.com/marinprusac/Hunted"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
REPOModding-MenuLib = "2.6.1"
# Optional: lets players change the settings in game. Hunted does not need it to run.
REPOModding-REPOConfig = "1.2.7"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./dist"

[[build.copy]]
source = "./bin/Release/netstandard2.1/Hunted.dll"
target = "./"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./"

[publish]
repository = "https://thunderstore.io"
communities = ["repo"]

[publish.categories]
repo = []
